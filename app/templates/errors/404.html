{% extends "base.html" %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-main); padding: 1.5rem;">
  <div style="background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 3rem 2rem; max-width: 480px; width: 100%; text-align: center; box-shadow: var(--shadow-modal);">
    <div style="width: 64px; height: 64px; border-radius: 50%; background-color: #FEF3C7; color: #D97706; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;">
      <i data-lucide="help-circle" style="width: 32px; height: 32px;"></i>
    </div>
    <div style="font-size: 0.8125rem; font-weight: 700; color: #D97706; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
      404 Error
    </div>
    <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 0.75rem;">Link Not Found</h2>
    <p style="color: var(--text-secondary); font-size: 0.9375rem; line-height: 1.6; margin-bottom: 2rem;">
      The requested short URL {% if code %}<code>/{{ code }}</code>{% endif %} does not exist or may have been deleted by its owner.
    </p>
    <a href="/" class="btn btn-primary" style="width: 100%;">
      Return to Home
    </a>
  </div>
</div>
{% endblock %}
