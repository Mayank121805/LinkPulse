{% extends "base.html" %}

{% block extra_css %}
<style>
  .lock-screen-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background-color: var(--bg-main);
    padding: 1.5rem;
  }
  .lock-card {
    background-color: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 2.5rem 2rem;
    max-width: 440px;
    width: 100%;
    box-shadow: var(--shadow-modal);
    text-align: center;
  }
  .lock-icon-wrap {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background-color: var(--primary-subtle);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.25rem;
    box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.08);
  }
</style>
{% endblock %}

{% block content %}
<div class="lock-screen-wrapper">
  <div class="lock-card">
    <div class="lock-icon-wrap">
      <i data-lucide="lock" style="width: 28px; height: 28px;"></i>
    </div>

    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary);">
      Password Protected Link
    </h2>
    <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.5;">
      This short URL (<code>/{{ code }}</code>) requires authorized credentials before redirecting.
    </p>

    {% if error %}
    <div style="background-color: var(--status-limit-bg); color: var(--status-limit-text); border: 1px solid var(--status-limit-border); border-radius: var(--radius-md); padding: 0.75rem; font-size: 0.8125rem; margin-bottom: 1.25rem;">
      {{ error }}
    </div>
    {% endif %}

    <form action="/r/{{ code }}" method="POST">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="passwordInput">Enter Access Password</label>
        <input 
          type="password" 
          id="passwordInput" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autofocus
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        <i data-lucide="key" style="width: 15px; height: 15px;"></i> Unlock & Redirect
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 0.35rem;">
      <i data-lucide="shield-check" style="width: 13px; height: 13px;"></i> Secured by LinkPulse Gateway
    </div>
  </div>
</div>
{% endblock %}
